<style>
  *{ -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    background:#0A0D12;
    overscroll-behavior-y: none;
  }
  ::selection{ background: rgba(232,180,80,0.2); color:#E8B450; }
  ::-webkit-scrollbar{ width:0; height:0; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{ opacity:1; }
  .tabnum{ font-variant-numeric: tabular-nums; }
  .sheet{ transition: transform .32s cubic-bezier(.22,1,.36,1); }
  .scrim{ transition: opacity .25s ease; }
</style>

<body class="font-body text-ink">

<div class="max-w-[480px] mx-auto min-h-screen relative flex flex-col md:shadow-[0_0_60px_rgba(0,0,0,0.5)]">

  <!-- HEADER -->
  <header class="sticky top-0 z-20 flex items-center justify-between px-5 pt-[calc(env(safe-area-inset-top)+14px)] pb-3 bg-gradient-to-b from-bg from-70% to-transparent">
    <div class="flex items-center gap-2">
      <span class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0" style="background:linear-gradient(155deg,#E8B450,#B9862F)">
        <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4">
          <path d="M4 9.5c1.5-2.5 4-3.5 6.5-3l7 1.4M17.5 6l1 2-2.3.7" stroke="#241A05" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 14.5c-1.5 2.5-4 3.5-6.5 3l-7-1.4M6.5 18l-1-2 2.3-.7" stroke="#241A05" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="font-display font-black text-[1.02rem] tracking-tight">글로벌자산노트</span>
    </div>
    <button id="refreshBtn" type="button" class="flex items-center gap-1.5 text-ink2 text-[0.72rem] px-2.5 py-1.5 rounded-full bg-elev2 border border-brdsoft active:scale-95 transition">
      <svg id="refreshIcon" viewBox="0 0 24 24" fill="none" class="w-3.5 h-3.5">
        <path d="M4 12a8 8 0 0114-5.3M20 12a8 8 0 01-14 5.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M17.2 3.5v3.7h-3.7M6.8 20.5v-3.7h3.7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="lastUpdated">갱신 대기</span>
    </button>
  </header>

  <main class="flex-1 px-5 pb-32 flex flex-col gap-4">

    <!-- CURRENCY TOGGLE -->
    <div class="grid grid-cols-2 gap-1.5 p-1.5 bg-elev2 rounded-2xl border border-brdsoft">
      <button id="toggleKRW" type="button" class="py-2.5 rounded-xl font-display font-bold text-[0.85rem] transition">₩ 원화로 보기</button>
      <button id="toggleUSD" type="button" class="py-2.5 rounded-xl font-display font-bold text-[0.85rem] transition">$ 달러로 보기</button>
    </div>

    <!-- FX RATE CARD -->
    <section class="bg-elev border border-brdsoft rounded-2xl px-5 py-4 flex items-center justify-between">
      <div>
        <p class="text-[0.72rem] text-ink2 mb-1">원/달러 환율 (USD/KRW)</p>
        <p class="font-mono font-bold text-[1.3rem] tabnum" id="fxRate">₩0.00</p>
      </div>
      <div class="text-right">
        <span class="badge inline-flex items-center gap-1 font-mono font-semibold text-[0.78rem] px-2.5 py-1 rounded-full" id="fxBadge">0.00%</span>
        <p class="text-[0.65rem] text-ink3 mt-1.5" id="fxUpdatedAt">전일 대비</p>
      </div>
    </section>

    <!-- HERO SUMMARY -->
    <section class="rounded-2xl border border-brdsoft p-6 pb-5" style="background:radial-gradient(120% 140% at 100% -20%, rgba(232,180,80,0.16), transparent 55%), #12161E">
      <p class="text-[0.8rem] text-ink2 mb-2" id="totalLabel">총자산 (₩ 원화)</p>
      <div class="flex items-baseline gap-2.5 flex-wrap">
        <div class="font-display font-black text-[2.15rem] leading-tight tracking-tight tabnum" id="totalValue">₩0</div>
        <span class="badge inline-flex items-center gap-1 font-mono font-semibold text-[0.8rem] px-2.5 py-1 rounded-full" id="totalBadge">0.0%</span>
      </div>

      <div class="grid grid-cols-2 gap-2.5 mt-4">
        <div class="bg-elev2 rounded-xl px-3.5 py-3">
          <p class="text-[0.7rem] text-ink3 mb-1">총 투자원금</p>
          <p class="font-mono font-semibold text-[0.95rem] tabnum" id="totalPrincipal">₩0</p>
        </div>
        <div class="bg-elev2 rounded-xl px-3.5 py-3">
          <p class="text-[0.7rem] text-ink3 mb-1">총 평가손익</p>
          <p class="font-mono font-semibold text-[0.95rem] tabnum" id="totalProfit">₩0</p>
        </div>
      </div>

      <div class="mt-5">
        <p class="text-[0.72rem] text-ink2 mb-2">통화별 자산 비중</p>
        <div class="flex h-2 rounded-full overflow-hidden bg-elev2">
          <div id="krwBar" class="h-full bg-gold transition-all duration-500" style="width:50%"></div>
          <div id="usdBar" class="h-full bg-usd transition-all duration-500" style="width:50%"></div>
        </div>
        <div class="flex justify-between mt-2.5">
          <div>
            <span class="inline-block w-2 h-2 rounded-full bg-gold mr-1.5"></span>
            <span class="text-[0.72rem] text-ink2">원화자산</span>
            <p class="font-mono font-semibold text-[0.85rem] tabnum mt-0.5" id="krwTotal">₩0</p>
          </div>
          <div class="text-right">
            <span class="text-[0.72rem] text-ink2">달러자산</span>
            <span class="inline-block w-2 h-2 rounded-full bg-usd ml-1.5"></span>
            <p class="font-mono font-semibold text-[0.85rem] tabnum mt-0.5" id="usdTotal">₩0</p>
          </div>
        </div>
      </div>
    </section>

    <!-- ALLOCATION -->
    <section class="bg-elev border border-brdsoft rounded-2xl p-5">
      <p class="font-display font-bold text-[0.95rem] mb-3.5">자산 비중</p>
      <div class="flex items-center gap-4">
        <div class="relative flex-shrink-0" id="donutWrap" style="width:128px;height:128px">
          <svg id="allocDonut" viewBox="0 0 128 128" style="width:128px;height:128px;transform:rotate(-90deg)"></svg>
        </div>
        <div class="flex-1 flex flex-col gap-2 min-w-0" id="legendList"></div>
      </div>
    </section>

    <!-- ASSET LIST -->
    <section class="bg-elev border border-brdsoft rounded-2xl p-5">
      <p class="font-display font-bold text-[0.95rem] mb-1 flex items-center justify-between">
        보유 자산
        <span class="font-mono font-medium text-[0.7rem] text-ink3 bg-elev2 px-2.5 py-1 rounded-full" id="assetCount">0개</span>
      </p>
      <div id="assetList" class="divide-y divide-brdsoft"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "globalassetnote.v1";
  var DEFAULT_FX = 1350;

  var CATS = {
    us_stock: { label:"미국주식",     mode:"live",   currency:"USD", color:"#E8B450",
      icon:'<path d="M3 17l5-6 4 4 7-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M15 6h5v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>' },
    krx:      { label:"국내ETF/주식", mode:"live",   currency:"KRW", color:"#4FD1C5",
      icon:'<path d="M5 19V13M10 19V9M15 19V14M20 19V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>' },
    crypto:   { label:"암호화폐",     mode:"live",   currency:"KRW", color:"#B98CFF",
      icon:'<circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M9.5 9.2c0-1 1-1.7 2.5-1.7s2.5.6 2.5 1.5c0 2.2-5 1.3-5 3.5 0 .9 1 1.5 2.5 1.5s2.5-.7 2.5-1.7M12 6.5v11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>' },
    cash:     { label:"현금",         mode:"manual", currency:null,  color:"#8FA0BC",
      icon:'<rect x="2.5" y="7" width="19" height="10" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="2.4" stroke="currentColor" stroke-width="1.8" fill="none"/>' },
    savings:  { label:"예금/적금",    mode:"manual", currency:null,  color:"#F0876B",
      icon:'<path d="M3 10l9-6 9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M5 10v8M10 10v8M14 10v8M19 10v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M3 21h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>' },
    other:    { label:"기타",         mode:"manual", currency:null,  color:"#6B7484",
      icon:'<circle cx="6" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18" cy="12" r="1.8" fill="currentColor"/>' }
  };
  var CAT_ORDER = ["us_stock","krx","crypto","cash","savings","other"];

  var SYMBOL_HINT = {
    us_stock: "예: TSLA, AAPL, NVDA (Yahoo Finance 티커)",
    krx: "예: 360750.KS, 005930.KS (Yahoo Finance 형식)",
    crypto: "예: BTC, ETH, XRP (업비트 원화마켓 기준)"
  };

  var ICON_UP   = '<svg viewBox="0 0 10 10" class="w-2 h-2"><path d="M5 1l4 6H1z" fill="currentColor"/></svg>';
  var ICON_DOWN = '<svg viewBox="0 0 10 10" class="w-2 h-2"><path d="M5 9L1 3h8z" fill="currentColor"/></svg>';
  var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" class="w-[15px] h-[15px]"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m-8 0l1 13a1 1 0 001 1h6a1 1 0 001-1l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function todayKey(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }

  // ---------- seed ----------
  function seedData(){
    return {
      displayCurrency: "KRW",
      fx: { rate: DEFAULT_FX, changePct: null, updatedAt: null, history: {} },
      assets: [
        { id: uid(), name:"테슬라 (TSLA)", category:"us_stock", currency:"USD", symbol:"TSLA",
          quantity:10, buyPrice:220.00, buyFxRate:1320.00, currentPrice:340.50,
          memo:"해외주식 계좌, 장기 보유", createdAt: Date.now()-1000*60*60*24*90 },
        { id: uid(), name:"TIGER 미국배당다우존스", category:"krx", currency:"KRW", symbol:"360750.KS",
          quantity:50, buyPrice:11800, buyFxRate:null, currentPrice:13250,
          memo:"국내 상장 배당 ETF", createdAt: Date.now()-1000*60*60*24*150 },
        { id: uid(), name:"비트코인", category:"crypto", currency:"KRW", symbol:"BTC",
          quantity:0.05, buyPrice:62000000, buyFxRate:null, currentPrice:142000000,
          memo:"업비트 지갑 보관", createdAt: Date.now()-1000*60*60*24*300 },
        { id: uid(), name:"달러 현금", category:"cash", currency:"USD", symbol:null,
          quantity:1, buyPrice:3000, buyFxRate:1310.00, currentPrice:3000,
          memo:"해외주식 추가 매수 대기 자금", createdAt: Date.now()-1000*60*60*24*20 }
      ]
    };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw){ var s = seedData(); saveState(s); return s; }
      var p = JSON.parse(raw);
      if(!p || !Array.isArray(p.assets)) throw new Error("bad shape");
      if(!p.fx) p.fx = { rate: DEFAULT_FX, changePct:null, updatedAt:null, history:{} };
      if(!p.displayCurrency) p.displayCurrency = "KRW";
      return p;
    }catch(e){
      var f = seedData(); saveState(f); return f;
    }
  }
  function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  var state = loadState();
  var editingId = null;
  var deletingId = null;
  var selectedCategory = "us_stock";
  var selectedCurrency = "KRW";

  // ---------- fetch helpers ----------
  function tryFetch(url, timeoutMs){
    return new Promise(function(resolve, reject){
      var ctrl = new AbortController();
      var t = setTimeout(function(){ ctrl.abort(); }, timeoutMs);
      fetch(url, { signal: ctrl.signal, cache:"no-store" }).then(function(r){
        clearTimeout(t);
        if(!r.ok){ reject(new Error("HTTP "+r.status)); return; }
        r.json().then(resolve).catch(reject);
      }).catch(function(err){ clearTimeout(t); reject(err); });
    });
  }
  function fetchJSON(url, timeoutMs){
    timeoutMs = timeoutMs || 8000;
    return tryFetch(url, timeoutMs).catch(function(){
      var proxied = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
      return tryFetch(proxied, timeoutMs);
    });
  }

  function fetchFxRate(){
    return fetchJSON("https://open.er-api.com/v6/latest/USD").then(function(data){
      if(data && data.rates && typeof data.rates.KRW === "number") return data.rates.KRW;
      throw new Error("no KRW rate");
    });
  }

  function fetchQuote(category, symbol){
    if(!symbol) return Promise.reject(new Error("no symbol"));
    if(category === "crypto"){
      var sym = symbol.toUpperCase().replace(/^KRW-/,"");
      return fetchJSON("https://api.upbit.com/v1/ticker?markets=KRW-"+encodeURIComponent(sym)).then(function(data){
        if(Array.isArray(data) && data[0] && typeof data[0].trade_price === "number") return data[0].trade_price;
        throw new Error("no price");
      });
    }
    if(category === "us_stock" || category === "krx"){
      var url = "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(symbol) + "?interval=1d&range=5d";
      return fetchJSON(url).then(function(data){
        var meta = data && data.chart && data.chart.result && data.chart.result[0] && data.chart.result[0].meta;
        if(meta && typeof meta.regularMarketPrice === "number") return meta.regularMarketPrice;
        throw new Error("no price");
      });
    }
    return Promise.reject(new Error("not a live category"));
  }

  // ---------- formatting ----------
  function getFx(){ return state.fx.rate || DEFAULT_FX; }

  function formatKRW(n){ return "₩" + Math.round(n||0).toLocaleString("ko-KR"); }
  function formatUSD(n){ return "$" + (n||0).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function formatNative(amount, currency){ return currency === "USD" ? formatUSD(amount) : formatKRW(amount); }

  function formatDisplay(krwAmount){
    var v = state.displayCurrency === "KRW" ? krwAmount : krwAmount / getFx();
    return state.displayCurrency === "KRW" ? formatKRW(v) : formatUSD(v);
  }
  function formatDisplaySigned(krwAmount){
    var v = state.displayCurrency === "KRW" ? krwAmount : krwAmount / getFx();
    var sign = v > 0.0001 ? "+" : (v < -0.0001 ? "-" : "");
    var abs = Math.abs(v);
    return sign + (state.displayCurrency === "KRW" ? formatKRW(abs) : formatUSD(abs));
  }
  function pctSigned(p){
    if(!isFinite(p)) p = 0;
    return (p > 0 ? "+" : "") + p.toFixed(1) + "%";
  }
  function formatQty(q){
    q = Number(q) || 0;
    if(Math.abs(q) >= 1 || q === 0) return q.toLocaleString("en-US", {maximumFractionDigits:4});
    return q.toLocaleString("en-US", {maximumFractionDigits:8});
  }
  function trendClass(n){ return n > 0.001 ? "up" : (n < -0.001 ? "down" : "flat"); }
  function badgeClasses(tc){
    if(tc === "up") return "bg-upsoft text-up";
    if(tc === "down") return "bg-downsoft text-down";
    return "bg-elev2 text-ink2";
  }
  function textColorClass(tc){
    if(tc === "up") return "text-up";
    if(tc === "down") return "text-down";
    return "text-ink2";
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(m){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m];
    });
  }

  // ---------- computation ----------
  function computeFromValues(v){
    // v: { currency, qty, buy, cur, buyFx }
    var isUsd = v.currency === "USD";
    var fx = isUsd ? getFx() : 1;
    var buyFx = isUsd ? (v.buyFx || getFx()) : 1;
    var qty = Number(v.qty) || 0, buy = Number(v.buy) || 0, cur = Number(v.cur) || 0;
    var krwPrincipal = qty * buy * buyFx;
    var krwCurrent = qty * cur * fx;
    var totalProfitKRW = krwCurrent - krwPrincipal;
    var priceGainKRW = qty * (cur - buy) * fx;
    var fxGainKRW = isUsd ? qty * buy * (fx - buyFx) : 0;
    var pct = krwPrincipal > 0 ? (totalProfitKRW / krwPrincipal) * 100 : 0;
    var pricePct = krwPrincipal > 0 ? (priceGainKRW / krwPrincipal) * 100 : 0;
    var fxPct = krwPrincipal > 0 ? (fxGainKRW / krwPrincipal) * 100 : 0;
    return { isUsd:isUsd, krwPrincipal:krwPrincipal, krwCurrent:krwCurrent, totalProfitKRW:totalProfitKRW,
      priceGainKRW:priceGainKRW, fxGainKRW:fxGainKRW, pct:pct, pricePct:pricePct, fxPct:fxPct };
  }
  function computeAsset(a){
    return computeFromValues({ currency:a.currency, qty:a.quantity, buy:a.buyPrice, cur:a.currentPrice, buyFx:a.buyFxRate });
  }
  function computeTotals(){
    var principal=0, current=0, krwCur=0, usdCur=0;
    state.assets.forEach(function(a){
      var c = computeAsset(a);
      principal += c.krwPrincipal;
      current += c.krwCurrent;
      if(c.isUsd) usdCur += c.krwCurrent; else krwCur += c.krwCurrent;
    });
    var profit = current - principal;
    var pct = principal > 0 ? (profit/principal)*100 : 0;
    return { principal:principal, current:current, profit:profit, pct:pct, krwCur:krwCur, usdCur:usdCur };
  }

  // ---------- rendering ----------
  function render(){
    renderCurrencyToggle();
    renderFxCard();
    var t = computeTotals();
    renderHero(t);
    renderAllocation();
    renderList();
  }

  function renderCurrencyToggle(){
    var krwBtn = document.getElementById("toggleKRW");
    var usdBtn = document.getElementById("toggleUSD");
    var activeCls = ["bg-gold","text-[#241A05]"];
    var inactiveCls = ["text-ink2"];
    [krwBtn, usdBtn].forEach(function(btn){ activeCls.concat(inactiveCls).forEach(function(c){ btn.classList.remove(c); }); });
    if(state.displayCurrency === "KRW"){
      activeCls.forEach(function(c){ krwBtn.classList.add(c); });
      inactiveCls.forEach(function(c){ usdBtn.classList.add(c); });
    } else {
      activeCls.forEach(function(c){ usdBtn.classList.add(c); });
      inactiveCls.forEach(function(c){ krwBtn.classList.add(c); });
    }
  }

  function renderFxCard(){
    document.getElementById("fxRate").textContent = "₩" + getFx().toLocaleString("ko-KR", {minimumFractionDigits:2, maximumFractionDigits:2});
    var badge = document.getElementById("fxBadge");
    var cp = state.fx.changePct;
    if(cp === null || cp === undefined){
      badge.className = "badge inline-flex items-center gap-1 font-mono font-semibold text-[0.78rem] px-2.5 py-1 rounded-full bg-elev2 text-ink3";
      badge.textContent = "―";
    } else {
      var tc = trendClass(cp);
      badge.className = "badge inline-flex items-center gap-1 font-mono font-semibold text-[0.78rem] px-2.5 py-1 rounded-full " + badgeClasses(tc);
      badge.innerHTML = (tc==="up"?ICON_UP:tc==="down"?ICON_DOWN:"") + " " + pctSigned(cp);
    }
    var upd = document.getElementById("fxUpdatedAt");
    if(state.fx.updatedAt){
      var d = new Date(state.fx.updatedAt);
      upd.textContent = d.toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit"}) + " 기준";
    } else {
      upd.textContent = "환율 정보 갱신 필요";
    }
  }

  function renderHero(t){
    document.getElementById("totalLabel").textContent = state.displayCurrency === "KRW" ? "총자산 (₩ 원화)" : "총자산 ($ 달러)";
    document.getElementById("totalValue").textContent = formatDisplay(t.current);

    var tc = trendClass(t.pct);
    var badge = document.getElementById("totalBadge");
    badge.className = "badge inline-flex items-center gap-1 font-mono font-semibold text-[0.8rem] px-2.5 py-1 rounded-full " + badgeClasses(tc);
    badge.innerHTML = (tc==="up"?ICON_UP:tc==="down"?ICON_DOWN:"") + " " + pctSigned(t.pct);

    document.getElementById("totalPrincipal").textContent = formatDisplay(t.principal);
    var profitEl = document.getElementById("totalProfit");
    profitEl.textContent = formatDisplaySigned(t.profit);
    profitEl.className = "font-mono font-semibold text-[0.95rem] tabnum " + textColorClass(tc);

    var totalCurAssets = t.krwCur + t.usdCur;
    var krwPct = totalCurAssets > 0 ? (t.krwCur/totalCurAssets*100) : 50;
    document.getElementById("krwBar").style.width = krwPct + "%";
    document.getElementById("usdBar").style.width = (100-krwPct) + "%";
    document.getElementById("krwTotal").textContent = formatDisplay(t.krwCur);
    document.getElementById("usdTotal").textContent = formatDisplay(t.usdCur);
  }

  function renderAllocation(){
    var sums = {};
    CAT_ORDER.forEach(function(k){ sums[k] = 0; });
    state.assets.forEach(function(a){ sums[a.category] = (sums[a.category]||0) + computeAsset(a).krwCurrent; });
    var present = CAT_ORDER.filter(function(k){ return sums[k] > 0; });
    var total = present.reduce(function(s,k){ return s+sums[k]; }, 0);
    var sortedPresent = present.slice().sort(function(a,b){ return sums[b]-sums[a]; });

    var legend = document.getElementById("legendList");
    legend.innerHTML = "";
    var tooltipParts = [];
    sortedPresent.forEach(function(k){
      var pct = total>0 ? (sums[k]/total*100) : 0;
      tooltipParts.push(CATS[k].label + " " + pct.toFixed(0) + "% (" + formatDisplay(sums[k]) + ")");
      var row = document.createElement("div");
      row.className = "flex items-center gap-2 text-[0.78rem]";
      row.innerHTML =
        '<span class="w-2 h-2 rounded-full flex-shrink-0" style="background:'+CATS[k].color+'"></span>' +
        '<span class="text-ink2 flex-1 min-w-0 truncate">'+CATS[k].label+'</span>' +
        '<span class="font-mono font-semibold tabnum">'+pct.toFixed(0)+'%</span>';
      legend.appendChild(row);
    });

    // Inline SVG ring: no chart library / CDN dependency, so it always paints
    // instantly regardless of network conditions. Small gaps between arcs
    // (rather than one continuous gradient) make adjacent colors easy to tell
    // apart even when two categories land on similar hues.
    var svg = document.getElementById("allocDonut");
    var wrap = document.getElementById("donutWrap");
    var R = 44, C = 64, SW = 20;
    var circumference = 2 * Math.PI * R;
    var GAP = 3.2; // viewBox units of visible gap between segments

    var parts = ['<circle cx="'+C+'" cy="'+C+'" r="'+R+'" fill="none" stroke="#1B212C" stroke-width="'+SW+'"/>'];
    var acc0 = 0;

    sortedPresent.forEach(function(k){
      var pct = total > 0 ? (sums[k] / total * 100) : 0;
      var rawLen = circumference * pct / 100;
      var gap = Math.min(GAP, rawLen * 0.4);
      var visibleLen = Math.max(rawLen - gap, rawLen > 0 ? 1 : 0);
      var dashOffset = -(acc0 + gap / 2);
      parts.push(
        '<circle cx="'+C+'" cy="'+C+'" r="'+R+'" fill="none" stroke="'+CATS[k].color+'" stroke-width="'+SW+'" ' +
        'stroke-dasharray="'+visibleLen.toFixed(2)+' '+(circumference - visibleLen).toFixed(2)+'" ' +
        'stroke-dashoffset="'+dashOffset.toFixed(2)+'"/>'
      );
      acc0 += rawLen;
    });

    svg.innerHTML = parts.join("");
    wrap.title = tooltipParts.join(" · ");
  }

  function renderList(){
    var list = document.getElementById("assetList");
    list.innerHTML = "";
    document.getElementById("assetCount").textContent = state.assets.length + "개";

    if(state.assets.length === 0){
      list.innerHTML = '<div class="text-center py-8 px-2 text-ink3 text-[0.85rem]">아직 등록된 자산이 없어요.<br>오른쪽 아래 + 버튼으로 추가해보세요.</div>';
      return;
    }

    var sorted = state.assets.slice().sort(function(a,b){ return computeAsset(b).krwCurrent - computeAsset(a).krwCurrent; });

    sorted.forEach(function(a){
      var c = computeAsset(a);
      var tc = trendClass(c.pct);
      var cat = CATS[a.category] || CATS.other;
      var curPillCls = a.currency === "USD" ? "bg-usdsoft text-usd" : "bg-krwsoft text-gold";

      var nativeLine = "";
      if(cat.mode === "live"){
        var unit = a.category === "crypto" ? "개" : "주";
        nativeLine = '<p class="text-[0.68rem] text-ink3 font-mono tabnum mt-0.5">'+formatQty(a.quantity)+unit+' · 현재가 '+formatNative(a.currentPrice, a.currency)+'</p>';
      }

      var fxLine = "";
      if(c.isUsd){
        var ptc = trendClass(c.pricePct), ftc = trendClass(c.fxPct);
        fxLine = '<p class="text-[0.66rem] text-ink3 font-mono tabnum mt-1">주가 <span class="'+textColorClass(ptc)+'">'+pctSigned(c.pricePct)+'</span> · 환 <span class="'+textColorClass(ftc)+'">'+pctSigned(c.fxPct)+'</span></p>';
      }

      var row = document.createElement("div");
      row.className = "flex items-center gap-3 py-3.5";
      row.setAttribute("data-id", a.id);
      row.innerHTML =
        '<span class="w-[38px] h-[38px] rounded-[11px] flex items-center justify-center flex-shrink-0" style="background:'+cat.color+'22;color:'+cat.color+'">' +
          '<svg viewBox="0 0 24 24" fill="none" class="w-[18px] h-[18px]">'+cat.icon+'</svg>' +
        '</span>' +
        '<span class="flex-1 min-w-0 cursor-pointer">' +
          '<p class="text-[0.92rem] font-semibold truncate">'+escapeHtml(a.name)+'</p>' +
          '<p class="text-[0.72rem] text-ink3">'+cat.label+' <span class="'+curPillCls+' rounded-full px-1.5 py-0.5 text-[0.6rem] font-mono font-semibold ml-1">'+a.currency+'</span></p>' +
          nativeLine +
        '</span>' +
        '<span class="text-right flex-shrink-0 cursor-pointer">' +
          '<p class="font-mono font-semibold text-[0.92rem] tabnum">'+formatDisplay(c.krwCurrent)+'</p>' +
          '<p class="font-mono text-[0.74rem] mt-0.5 flex items-center gap-1 justify-end '+textColorClass(tc)+'">'+(tc==="up"?ICON_UP:tc==="down"?ICON_DOWN:"")+' '+pctSigned(c.pct)+'</p>' +
          fxLine +
        '</span>' +
        '<button class="asset-del flex-shrink-0 w-[30px] h-[30px] rounded-[9px] flex items-center justify-center text-ink3" type="button" aria-label="삭제" data-id="'+a.id+'">'+ICON_TRASH+'</button>';

      row.querySelectorAll(".cursor-pointer").forEach(function(el){
        el.addEventListener("click", function(){ openForm(a.id); });
      });
      row.querySelector(".asset-del").addEventListener("click", function(ev){
        ev.stopPropagation();
        openDelete(a.id);
      });
      list.appendChild(row);
    });
  }

  // ---------- refresh ----------
  var refreshing = false;
  function refreshAll(){
    if(refreshing) return;
    refreshing = true;
    var icon = document.getElementById("refreshIcon");
    var label = document.getElementById("lastUpdated");
    icon.classList.add("animate-spin");
    label.textContent = "갱신중...";

    var liveAssets = state.assets.filter(function(a){ return CATS[a.category].mode === "live"; });
    var fxPromise = fetchFxRate().then(function(rate){
      var key = todayKey();
      var hist = state.fx.history || {};
      var prevKey = Object.keys(hist).filter(function(k){ return k !== key; }).sort().pop();
      var prevRate = prevKey ? hist[prevKey] : null;
      state.fx.changePct = prevRate ? ((rate-prevRate)/prevRate*100) : state.fx.changePct;
      hist[key] = rate;
      var keys = Object.keys(hist).sort();
      while(keys.length > 14){ delete hist[keys.shift()]; }
      state.fx.history = hist;
      state.fx.rate = rate;
      state.fx.updatedAt = Date.now();
      return true;
    }).catch(function(){ return false; });

    var quotePromises = liveAssets.map(function(a){
      return fetchQuote(a.category, a.symbol).then(function(price){
        a.currentPrice = price;
        return true;
      }).catch(function(){ return false; });
    });

    Promise.allSettled([fxPromise].concat(quotePromises)).then(function(results){
      var fxOk = results[0].value === true;
      var assetResults = results.slice(1);
      var failCount = assetResults.filter(function(r){ return r.value !== true; }).length;

      saveState();
      render();

      icon.classList.remove("animate-spin");
      label.textContent = new Date().toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit"}) + " 갱신";

      if(fxOk && failCount === 0 && liveAssets.length > 0){
        showToast("환율과 실시간 시세를 모두 갱신했어요");
      } else if(!fxOk && liveAssets.length === 0){
        showToast("환율 갱신에 실패했어요 (네트워크 확인)");
      } else if(failCount > 0 || !fxOk){
        showToast("일부 갱신에 실패했어요 (" + (failCount + (fxOk?0:1)) + "건) — 직접 입력도 가능해요");
      } else {
        showToast("환율을 갱신했어요");
      }
      refreshing = false;
    });
  }

  document.getElementById("refreshBtn").addEventListener("click", refreshAll);

  // ---------- currency toggle ----------
  document.getElementById("toggleKRW").addEventListener("click", function(){ state.displayCurrency = "KRW"; saveState(); render(); });
  document.getElementById("toggleUSD").addEventListener("click", function(){ state.displayCurrency = "USD"; saveState(); render(); });

  // ---------- form sheet ----------
  var formScrim = document.getElementById("formScrim");
  var formSheet = document.getElementById("formSheet");
  var assetForm = document.getElementById("assetForm");

  function buildCatChips(){
    var wrap = document.getElementById("catChips");
    wrap.innerHTML = "";
    CAT_ORDER.forEach(function(k){
      var active = k === selectedCategory;
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "flex flex-col items-center gap-1 py-2.5 rounded-xl border text-[0.72rem] font-medium " +
        (active ? "border-current bg-elev2" : "border-brd bg-elev2 text-ink2");
      if(active) chip.style.color = CATS[k].color;
      chip.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4">'+CATS[k].icon+'</svg>' +
        '<span>'+CATS[k].label+'</span>';
      chip.addEventListener("click", function(){
        selectedCategory = k;
        buildCatChips();
        updateFormFieldsForCategory();
        updatePreview();
      });
      wrap.appendChild(chip);
    });
  }

  function setCurrencyChipUI(){
    document.querySelectorAll(".cur-chip").forEach(function(btn){
      var isActive = btn.getAttribute("data-cur") === selectedCurrency;
      btn.classList.toggle("border-gold", isActive);
      btn.classList.toggle("text-gold", isActive);
      btn.classList.toggle("text-ink2", !isActive);
    });
  }
  document.querySelectorAll(".cur-chip").forEach(function(btn){
    btn.addEventListener("click", function(){
      selectedCurrency = btn.getAttribute("data-cur");
      setCurrencyChipUI();
      updateFormFieldsForCurrency();
      updatePreview();
    });
  });

  function resolvedCurrency(){
    var fixed = CATS[selectedCategory].currency;
    return fixed || selectedCurrency;
  }

  function updateFormFieldsForCategory(){
    var cat = CATS[selectedCategory];
    var isLive = cat.mode === "live";

    document.getElementById("symbolWrap").classList.toggle("hidden", !isLive);
    document.getElementById("currencyPickWrap").classList.toggle("hidden", isLive);
    document.getElementById("qtyFieldWrap").classList.toggle("hidden", !isLive);
    document.getElementById("buyPriceFieldWrap").classList.toggle("col-span-2", !isLive);

    document.getElementById("qtyLabel").textContent = "보유 수량";
    document.getElementById("buyPriceLabel").textContent = isLive ? "매수 단가 (해당 통화 기준)" : "매수 원금";
    document.getElementById("curPriceLabel").textContent = isLive ? "현재가 (실시간 조회 또는 직접 입력)" : "현재 평가금액";
    document.getElementById("fetchQuoteBtn").classList.toggle("hidden", !isLive);

    if(!isLive){
      document.getElementById("f_qty").value = 1;
    }
    if(isLive){
      document.getElementById("symbolHint").textContent = SYMBOL_HINT[selectedCategory] || "";
    }
    updateFormFieldsForCurrency();
  }

  function updateFormFieldsForCurrency(){
    var cur = resolvedCurrency();
    document.getElementById("buyFxWrap").classList.toggle("hidden", cur !== "USD");
    if(!CATS[selectedCategory].currency){ setCurrencyChipUI(); }
  }

  function openForm(id){
    editingId = id || null;
    var titleEl = document.getElementById("formTitle");
    var submitBtn = document.getElementById("formSubmit");

    if(editingId){
      var a = state.assets.find(function(x){ return x.id === editingId; });
      titleEl.textContent = "자산 수정";
      submitBtn.textContent = "수정 완료";
      selectedCategory = a.category;
      selectedCurrency = a.currency;
      document.getElementById("f_name").value = a.name;
      document.getElementById("f_symbol").value = a.symbol || "";
      document.getElementById("f_qty").value = a.quantity;
      document.getElementById("f_buyPrice").value = a.buyPrice;
      document.getElementById("f_buyFx").value = a.buyFxRate || "";
      document.getElementById("f_curPrice").value = a.currentPrice;
      document.getElementById("f_memo").value = a.memo || "";
    } else {
      titleEl.textContent = "자산 추가";
      submitBtn.textContent = "저장";
      assetForm.reset();
      selectedCategory = "us_stock";
      selectedCurrency = "KRW";
    }
    buildCatChips();
    updateFormFieldsForCategory();
    updatePreview();
    openSheet(formScrim, formSheet);
    setTimeout(function(){ document.getElementById("f_name").focus({preventScroll:true}); }, 320);
  }
  function closeForm(){ closeSheet(formScrim, formSheet); editingId = null; }

  function updatePreview(){
    var cur = resolvedCurrency();
    var qty = parseFloat(document.getElementById("f_qty").value) || 0;
    var buy = parseFloat(document.getElementById("f_buyPrice").value) || 0;
    var curPrice = parseFloat(document.getElementById("f_curPrice").value) || 0;
    var buyFx = parseFloat(document.getElementById("f_buyFx").value) || 0;

    var c = computeFromValues({ currency:cur, qty:qty, buy:buy, cur:curPrice, buyFx:buyFx });
    var tc = trendClass(c.pct);

    var profitEl = document.getElementById("prevProfit");
    var pctEl = document.getElementById("prevPct");
    profitEl.textContent = (c.totalProfitKRW>0?"+":c.totalProfitKRW<0?"-":"") + formatKRW(Math.abs(c.totalProfitKRW));
    profitEl.className = "font-mono font-bold text-[1.02rem] tabnum " + textColorClass(tc);
    pctEl.textContent = pctSigned(c.pct);
    pctEl.className = "font-mono font-bold text-[1.02rem] tabnum " + textColorClass(tc);
  }

  ["f_qty","f_buyPrice","f_curPrice","f_buyFx"].forEach(function(id){
    document.getElementById(id).addEventListener("input", updatePreview);
  });

  document.getElementById("fetchQuoteBtn").addEventListener("click", function(){
    var symbol = document.getElementById("f_symbol").value.trim();
    if(!symbol){ showToast("종목코드를 먼저 입력해주세요"); return; }
    var btn = document.getElementById("fetchQuoteBtn");
    var original = btn.textContent;
    btn.textContent = "조회중...";
    fetchQuote(selectedCategory, symbol).then(function(price){
      var rounded = selectedCategory === "us_stock" ? Math.round(price*100)/100 : Math.round(price);
      document.getElementById("f_curPrice").value = rounded;
      updatePreview();
      showToast("현재가 " + formatNative(rounded, resolvedCurrency()) + " 반영했어요");
    }).catch(function(){
      showToast("시세 조회에 실패했어요 — 코드 확인 또는 직접 입력해주세요");
    }).finally(function(){
      btn.textContent = original;
    });
  });

  assetForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    var name = document.getElementById("f_name").value.trim();
    if(!name) return;
    var cat = CATS[selectedCategory];
    var currency = resolvedCurrency();
    var symbol = document.getElementById("f_symbol").value.trim().toUpperCase();
    if(cat.mode === "live" && !symbol){ showToast("종목코드를 입력해주세요"); return; }

    var payload = {
      name: name,
      category: selectedCategory,
      currency: currency,
      symbol: cat.mode === "live" ? symbol : null,
      quantity: cat.mode === "live" ? (parseFloat(document.getElementById("f_qty").value) || 0) : 1,
      buyPrice: parseFloat(document.getElementById("f_buyPrice").value) || 0,
      buyFxRate: currency === "USD" ? (parseFloat(document.getElementById("f_buyFx").value) || getFx()) : null,
      currentPrice: parseFloat(document.getElementById("f_curPrice").value) || 0,
      memo: document.getElementById("f_memo").value.trim()
    };

    if(editingId){
      var a = state.assets.find(function(x){ return x.id === editingId; });
      Object.assign(a, payload);
      showToast("자산 정보를 수정했어요");
    } else {
      payload.id = uid();
      payload.createdAt = Date.now();
      state.assets.push(payload);
      showToast("자산을 추가했어요");
    }
    saveState();
    render();
    closeForm();
  });

  document.getElementById("formCancel").addEventListener("click", closeForm);
  formScrim.addEventListener("click", function(e){ if(e.target === formScrim) closeForm(); });
  document.getElementById("addFab").addEventListener("click", function(){ openForm(null); });

  // ---------- delete sheet ----------
  var delScrim = document.getElementById("delScrim");
  var delSheet = document.getElementById("delSheet");

  function openDelete(id){
    deletingId = id;
    var a = state.assets.find(function(x){ return x.id === id; });
    document.getElementById("delName").textContent = a ? a.name : "";
    openSheet(delScrim, delSheet);
  }
  document.getElementById("delCancel").addEventListener("click", function(){ closeSheet(delScrim, delSheet); deletingId = null; });
  delScrim.addEventListener("click", function(e){ if(e.target === delScrim){ closeSheet(delScrim, delSheet); deletingId = null; } });
  document.getElementById("delConfirm").addEventListener("click", function(){
    state.assets = state.assets.filter(function(x){ return x.id !== deletingId; });
    saveState();
    render();
    closeSheet(delScrim, delSheet);
    showToast("자산을 삭제했어요");
    deletingId = null;
  });

  // ---------- sheet helpers ----------
  function openSheet(scrim, sheet){
    scrim.classList.remove("opacity-0","pointer-events-none");
    scrim.classList.add("opacity-100","pointer-events-auto");
    sheet.classList.remove("translate-y-full");
  }
  function closeSheet(scrim, sheet){
    scrim.classList.add("opacity-0","pointer-events-none");
    scrim.classList.remove("opacity-100","pointer-events-auto");
    sheet.classList.add("translate-y-full");
  }

  // ---------- toast ----------
  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.remove("opacity-0","translate-y-5");
    t.classList.add("opacity-100","translate-y-0");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      t.classList.add("opacity-0","translate-y-5");
      t.classList.remove("opacity-100","translate-y-0");
    }, 2200);
  }

  // ---------- init ----------
  render();
  setTimeout(refreshAll, 500);

})();

</script>
</body>
</html>
