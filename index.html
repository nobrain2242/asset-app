<style>
  :root{
    color-scheme: dark;
    --bg: #0A0D12;
    --bg-elev: #12161E;
    --bg-elev-2: #1A2029;
    --bg-elev-3: #212936;
    --border: #232B37;
    --border-soft: #1A212B;
    --text: #F3F5F8;
    --text-2: #8A93A8;
    --text-3: #5B6474;
    --accent: #E8B450;
    --accent-ink: #2A1E06;
    --accent-soft: rgba(232,180,80,0.14);
    --up: #FF5D5D;
    --up-soft: rgba(255,93,93,0.13);
    --down: #4E8CFF;
    --down-soft: rgba(78,140,255,0.14);
    --cat-stock: #E8B450;
    --cat-savings: #4FD1C5;
    --cat-crypto: #B98CFF;
    --cat-cash: #8FA0BC;
    --cat-realestate: #F0876B;
    --cat-other: #6B7484;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --font-display: 'Gothic A1', 'Apple SD Gothic Neo', sans-serif;
    --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    padding-bottom: env(safe-area-inset-bottom);

  ::selection{ background: var(--accent-soft); color: var(--accent); }

  a, button, input, textarea{ font-family: inherit; color: inherit; }
  button{ cursor:pointer; }

  .app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    display:flex;
    flex-direction:column;
  }

    position: sticky;
    top:0;
    z-index: 20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: calc(env(safe-area-inset-top) + 14px) 20px 12px;
    background: linear-gradient(var(--bg) 70%, transparent);
  }

    display:flex;
    align-items:center;
    gap:8px;
    font-family: var(--font-display);
    font-weight:900;
    font-size: 1.05rem;
    letter-spacing:-0.01em;
  }
  .brand-mark{
    width:26px; height:26px; border-radius:8px;
    background: linear-gradient(155deg, var(--accent), #B9862F);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{ width:15px; height:15px; }
  .topbar .date{
    font-size:0.78rem;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  main{ flex:1; padding: 4px 20px 120px; display:flex; flex-direction:column; gap:16px; }

  /* ---------- generic card ---------- */
  .card{
    background: var(--bg-elev);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 20px;
  }
  .card-title{
    font-family: var(--font-display);
    font-weight:700;
    font-size:0.95rem;
    color: var(--text);
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 0 14px;
  }
  .card-title .count{
    font-family: var(--font-mono);
    font-size:0.72rem;
    font-weight:500;
    color: var(--text-3);
    background: var(--bg-elev-2);
    padding:3px 9px;
    border-radius:20px;
  }

  /* ---------- hero summary ---------- */
  .hero{
    background:
      radial-gradient(120% 140% at 100% -20%, rgba(232,180,80,0.16), transparent 55%),
      var(--bg-elev);
    border:1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 24px 22px 22px;
  }
  .hero-label{
    font-size:0.8rem;
    color: var(--text-2);
    margin:0 0 8px;
    font-weight:500;
  }
  .hero-total-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .hero-total{
    font-family: var(--font-display);
    font-weight:900;
    font-size: 2.35rem;
    letter-spacing:-0.02em;
    font-variant-numeric: tabular-nums;
    line-height:1.1;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-family: var(--font-mono);
    font-weight:600;
    font-size:0.82rem;
    padding:4px 9px 4px 8px;
    border-radius:20px;
    white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }
  .badge.up{ background: var(--up-soft); color: var(--up); }
  .badge.down{ background: var(--down-soft); color: var(--down); }
  .badge.flat{ background: var(--bg-elev-2); color: var(--text-2); }
  .badge svg{ width:10px; height:10px; }

  .hero-stats{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    margin-top:18px;
  }
  .stat-tile{
    background: var(--bg-elev-2);
    border-radius: var(--radius-md);
    padding:12px 14px;
  }
  .stat-tile .k{ font-size:0.72rem; color:var(--text-3); margin:0 0 4px; }
  .stat-tile .v{
    font-family: var(--font-mono);
    font-weight:600;
    font-size:0.98rem;
    font-variant-numeric: tabular-nums;
  }
  .stat-tile .v.up{ color:var(--up); }
  .stat-tile .v.down{ color:var(--down); }

  /* ---------- goal gauge ---------- */
  .goal-block{ margin-top:20px; }
  .goal-head{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px;
  }
  .goal-head .label{ font-size:0.78rem; color:var(--text-2); display:flex; align-items:center; gap:6px; }
  .goal-head button.edit-goal{
    background:none; border:none; color:var(--text-3); font-size:0.72rem;
    display:flex; align-items:center; gap:3px; padding:2px;
  }
  .goal-head button.edit-goal svg{ width:11px; height:11px; }
  .goal-pct{
    font-family: var(--font-mono); font-weight:600; color:var(--accent); font-size:0.85rem;
  }
  .gauge{
    height:10px;
    background: var(--bg-elev-2);
    border-radius:20px;
    overflow:hidden;
    position:relative;
  }
  .gauge-fill{
    height:100%;
    border-radius:20px;
    background: linear-gradient(90deg, #B9862F, var(--accent));
    transition: width .6s cubic-bezier(.22,1,.36,1);
  }
  .goal-foot{
    display:flex; justify-content:space-between; margin-top:7px;
    font-size:0.72rem; color:var(--text-3); font-variant-numeric: tabular-nums;
  }

  /* ---------- donut / allocation card ---------- */
  .alloc-body{ display:flex; align-items:center; gap:18px; }
  .donut-wrap{ position:relative; width:128px; height:128px; flex-shrink:0; }
  .donut-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; pointer-events:none;
  }
  .donut-center .n{ font-family:var(--font-display); font-weight:900; font-size:1.15rem; }
  .donut-center .l{ font-size:0.65rem; color:var(--text-3); margin-top:1px; }
  .legend{ flex:1; display:flex; flex-direction:column; gap:9px; min-width:0; }
  .legend-row{ display:flex; align-items:center; gap:8px; font-size:0.78rem; }
  .legend-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .legend-name{ color:var(--text-2); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .legend-pct{ font-family:var(--font-mono); font-weight:600; font-variant-numeric: tabular-nums; }

  /* ---------- asset list ---------- */
  .asset-row{
    display:flex; align-items:center; gap:12px;
    padding:13px 4px;
    border-bottom:1px solid var(--border-soft);
    cursor:pointer;
  }
  .asset-list .asset-row:last-child{ border-bottom:none; padding-bottom:2px; }
  .asset-icon{
    width:38px; height:38px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .asset-icon svg{ width:18px; height:18px; }
  .asset-main{ flex:1; min-width:0; }
  .asset-name{ font-size:0.92rem; font-weight:600; margin:0 0 3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .asset-cat{ font-size:0.72rem; color:var(--text-3); }
  .asset-figures{ text-align:right; flex-shrink:0; }
  .asset-value{ font-family:var(--font-mono); font-weight:600; font-size:0.92rem; font-variant-numeric: tabular-nums; }
  .asset-change{ font-family:var(--font-mono); font-size:0.74rem; margin-top:3px; font-variant-numeric: tabular-nums; display:flex; align-items:center; gap:2px; justify-content:flex-end; }
  .asset-change svg{ width:8px; height:8px; }
  .asset-change.up{ color:var(--up); }
  .asset-change.down{ color:var(--down); }
  .asset-change.flat{ color:var(--text-3); }
  .asset-del{
    flex-shrink:0; width:30px; height:30px; border-radius:9px; border:none;
    background:transparent; color:var(--text-3); display:flex; align-items:center; justify-content:center;
  }
  .asset-del svg{ width:15px; height:15px; }
  .empty-state{ text-align:center; padding:30px 10px; color:var(--text-3); font-size:0.85rem; }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    left:50%;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(calc(-50% + 190px));
    width:58px; height:58px; border-radius:50%;
    background: linear-gradient(155deg, var(--accent), #B9862F);
    border:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 24px -6px rgba(232,180,80,0.45), 0 2px 8px rgba(0,0,0,0.4);
    z-index: 30;
  }
  .fab svg{ width:24px; height:24px; color:#241A05; }
  .fab:active{ transform: translateX(calc(-50% + 190px)) scale(0.94); }
  @media (max-width: 479px){
    .fab{ transform: translateX(calc(-50% + calc(50vw - 44px))); }
    .fab:active{ transform: translateX(calc(-50% + calc(50vw - 44px))) scale(0.94); }
  }

  /* ---------- sheet / modal ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(4,5,8,0.6);
    backdrop-filter: blur(2px);
    opacity:0; pointer-events:none; transition: opacity .25s ease;
    z-index:40;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0;
    max-width:480px; margin:0 auto;
    background: var(--bg-elev);
    border-top:1px solid var(--border);
    border-radius: 22px 22px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 20px);
    transform: translateY(105%);
    transition: transform .32s cubic-bezier(.22,1,.36,1);
    z-index:41;
    max-height: 88vh;
    overflow-y:auto;
  }
  .sheet.open{ transform: translateY(0); }
  .sheet-handle{ width:36px; height:4px; border-radius:3px; background:var(--bg-elev-3); margin: 4px auto 14px; }
  .sheet-title{ font-family:var(--font-display); font-weight:900; font-size:1.1rem; margin:0 0 18px; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:0.78rem; color:var(--text-2); margin-bottom:7px; font-weight:500; }
  .field input[type="text"], .field input[type="number"], .field textarea{
    width:100%; background: var(--bg-elev-2); border:1px solid var(--border);
    border-radius: var(--radius-sm); padding:12px 14px; font-size:0.95rem; color:var(--text);
    outline:none; font-family: var(--font-body);
  }
  .field input[type="number"]{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .field input:focus, .field textarea:focus{ border-color: var(--accent); }
  .field textarea{ resize:none; height:64px; font-size:0.88rem; }
  .field .won-prefix{ position:relative; }
  .field .won-prefix span{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-3); font-family:var(--font-mono); font-size:0.95rem; }
  .field .won-prefix input{ padding-left:28px; }

  .cat-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .cat-chip{
    display:flex; align-items:center; gap:6px;
    padding:8px 13px; border-radius:20px; border:1px solid var(--border);
    background: var(--bg-elev-2); font-size:0.82rem; color: var(--text-2);
  }
  .cat-chip .dot{ width:7px; height:7px; border-radius:50%; }
  .cat-chip.active{ border-color: currentColor; background: var(--accent-soft); color: var(--accent); }

  .preview-box{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--bg-elev-2); border-radius: var(--radius-md);
    padding:14px 16px; margin-bottom:18px;
  }
  .preview-box .pk{ font-size:0.75rem; color:var(--text-3); margin-bottom:4px; }
  .preview-box .pv{ font-family:var(--font-mono); font-weight:700; font-size:1.05rem; font-variant-numeric: tabular-nums; }
  .preview-box .pv.up{ color:var(--up); }
  .preview-box .pv.down{ color:var(--down); }
  .preview-box .pv.flat{ color:var(--text-2); }

  .sheet-actions{ display:flex; gap:10px; margin-top:4px; }
  .btn{
    flex:1; border:none; border-radius: var(--radius-sm); padding:15px;
    font-family: var(--font-display); font-weight:700; font-size:0.95rem; text-align:center;
  }
  .btn-primary{ background: var(--accent); color:#241A05; }
  .btn-primary:active{ opacity:0.85; }
  .btn-ghost{ background: var(--bg-elev-2); color: var(--text-2); }
  .btn-danger{ background: var(--up-soft); color: var(--up); }

  .confirm-body{ font-size:0.88rem; color:var(--text-2); line-height:1.5; margin-bottom:20px; }
  .confirm-body b{ color:var(--text); }

  .toast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px);
    background: var(--bg-elev-3); color:var(--text); padding:11px 20px; border-radius:30px;
    font-size:0.82rem; font-weight:500; opacity:0; pointer-events:none; transition:.25s ease;
    z-index:60; white-space:nowrap; border:1px solid var(--border);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (min-width:481px){
    body{ background: #05070A; }
    .app{ background: var(--bg); min-height: 100dvh; box-shadow: 0 0 60px rgba(0,0,0,0.5); }
  }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20V13M10 20V8M16 20V11M22 20V4" stroke="#241A05" stroke-width="3" stroke-linecap="round"/></svg>
      </span>
      자산노트
    </div>
    <div class="date" id="todayLabel"></div>
  </header>

  <main>

    <!-- HERO -->
    <section class="hero">
      <p class="hero-label">총자산</p>
      <div class="hero-total-row">
        <div class="hero-total" id="totalValue">₩0</div>
        <span class="badge flat" id="totalBadge">0.0%</span>
      </div>

      <div class="hero-stats">
        <div class="stat-tile">
          <p class="k">총 투자원금</p>
          <p class="v" id="totalPrincipal">₩0</p>
        </div>
        <div class="stat-tile">
          <p class="k">총 평가손익</p>
          <p class="v" id="totalProfit">₩0</p>
        </div>
      </div>

      <div class="goal-block">
        <div class="goal-head">
          <span class="label">
            목표 자산 달성률
            <button class="edit-goal" id="editGoalBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 20l4.2-.9L20 7.3a1.5 1.5 0 000-2.1l-1.2-1.2a1.5 1.5 0 00-2.1 0L4.9 15.8 4 20z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
              수정
            </button>
          </span>
          <span class="goal-pct" id="goalPct">0%</span>
        </div>
        <div class="gauge"><div class="gauge-fill" id="goalFill" style="width:0%"></div></div>
        <div class="goal-foot">
          <span id="goalCurrent">₩0</span>
          <span id="goalTarget">목표 ₩0</span>
        </div>
      </div>
    </section>

    <!-- ALLOCATION -->
    <section class="card">
      <p class="card-title">자산 비중</p>
      <div class="alloc-body">
        <div class="donut-wrap">
          <canvas id="allocChart"></canvas>
          <div class="donut-center">
            <span class="n" id="donutCatCount">0</span>
            <span class="l">종류</span>
          </div>
        </div>
        <div class="legend" id="legendList"></div>
      </div>
    </section>

    <!-- ASSET LIST -->
    <section class="card">
      <p class="card-title">보유 자산 <span class="count" id="assetCount">0개</span></p>
      <div class="asset-list" id="assetList"></div>
    </section>

  </main>

  <button class="fab" id="addFab" type="button" aria-label="자산 추가">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
  </button>

</div>

<!-- ASSET FORM SHEET -->
<div class="scrim" id="formScrim"></div>
<div class="sheet" id="formSheet">
  <div class="sheet-handle"></div>
  <h3 class="sheet-title" id="formTitle">자산 추가</h3>
  <form id="assetForm">
    <div class="field">
      <label for="f_name">자산 / 상품명</label>
      <input type="text" id="f_name" placeholder="예: 삼성전자, KB 정기예금" required>
    </div>
    <div class="field">
      <label>카테고리</label>
      <div class="cat-chips" id="catChips"></div>
    </div>
    <div class="field">
      <label for="f_principal">매수 원금</label>
      <div class="won-prefix"><span>₩</span><input type="number" inputmode="numeric" id="f_principal" placeholder="0" min="0" required></div>
    </div>
    <div class="field">
      <label for="f_current">현재 평가금액</label>
      <div class="won-prefix"><span>₩</span><input type="number" inputmode="numeric" id="f_current" placeholder="0" min="0" required></div>
    </div>

    <div class="preview-box">
      <div>
        <p class="pk">평가손익</p>
        <p class="pv flat" id="prevProfit">₩0</p>
      </div>
      <div style="text-align:right">
        <p class="pk">등락률</p>
        <p class="pv flat" id="prevPct">0.0%</p>
      </div>
    </div>

    <div class="field">
      <label for="f_memo">메모 (선택)</label>
      <textarea id="f_memo" placeholder="계좌, 매수 시점, 목표가 등 자유롭게 기록"></textarea>
    </div>

    <div class="sheet-actions">
      <button type="button" class="btn btn-ghost" id="formCancel">취소</button>
      <button type="submit" class="btn btn-primary" id="formSubmit">저장</button>
    </div>
  </form>
</div>

<!-- GOAL EDIT SHEET -->
<div class="scrim" id="goalScrim"></div>
<div class="sheet" id="goalSheet">
  <div class="sheet-handle"></div>
  <h3 class="sheet-title">목표 자산 수정</h3>
  <div class="field">
    <label for="f_goal">목표 금액</label>
    <div class="won-prefix"><span>₩</span><input type="number" inputmode="numeric" id="f_goal" min="0"></div>
  </div>
  <div class="sheet-actions">
    <button type="button" class="btn btn-ghost" id="goalCancel">취소</button>
    <button type="button" class="btn btn-primary" id="goalSave">저장</button>
  </div>
</div>

<!-- DELETE CONFIRM SHEET -->
<div class="scrim" id="delScrim"></div>
<div class="sheet" id="delSheet">
  <div class="sheet-handle"></div>
  <h3 class="sheet-title">자산 삭제</h3>
  <p class="confirm-body"><b id="delName"></b> 항목을 삭제할까요?<br>삭제한 내용은 되돌릴 수 없어요.</p>
  <div class="sheet-actions">
    <button type="button" class="btn btn-ghost" id="delCancel">취소</button>
    <button type="button" class="btn btn-danger" id="delConfirm">삭제</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "assetnote.v1";

  var CATS = {
    stock:      { label:"주식",     color:"#E8B450", icon:'<path d="M3 17l5-6 4 4 7-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M15 6h5v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>' },
    savings:    { label:"예금/적금", color:"#4FD1C5", icon:'<path d="M3 10l9-6 9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M5 10v8M10 10v8M14 10v8M19 10v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M3 21h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>' },
    crypto:     { label:"암호화폐",  color:"#B98CFF", icon:'<circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M9.5 9.2c0-1 1-1.7 2.5-1.7s2.5.6 2.5 1.5c0 2.2-5 1.3-5 3.5 0 .9 1 1.5 2.5 1.5s2.5-.7 2.5-1.7M12 6.5v11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>' },
    cash:       { label:"현금",     color:"#8FA0BC", icon:'<rect x="2.5" y="7" width="19" height="10" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="2.4" stroke="currentColor" stroke-width="1.8" fill="none"/>' },
    realestate: { label:"부동산",   color:"#F0876B", icon:'<path d="M4 11.5L12 4l8 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M6 10v9.5a1 1 0 001 1h10a1 1 0 001-1V10" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/><path d="M10 20.5v-5h4v5" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/>' },
    other:      { label:"기타",     color:"#6B7484", icon:'<circle cx="6" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18" cy="12" r="1.8" fill="currentColor"/>' }
  };

  var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m-8 0l1 13a1 1 0 001 1h6a1 1 0 001-1l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function seedData(){
    return {
      goal: 100000000,
      assets: [
        { id: uid(), name:"삼성전자",           category:"stock",      principal:5000000,  current:6150000,  memo:"국내 대표 반도체주, 배당 재투자 중",       createdAt: Date.now()-1000*60*60*24*40 },
        { id: uid(), name:"애플 (AAPL)",         category:"stock",      principal:8000000,  current:7200000,  memo:"해외주식 계좌, 장기 보유",                createdAt: Date.now()-1000*60*60*24*120 },
        { id: uid(), name:"KB 정기예금 12개월",  category:"savings",    principal:20000000, current:20450000, memo:"연 2.3% 정기예금, 만기 2026-12",           createdAt: Date.now()-1000*60*60*24*200 },
        { id: uid(), name:"비트코인",            category:"crypto",     principal:3000000,  current:4650000,  memo:"업비트 지갑 보관",                        createdAt: Date.now()-1000*60*60*24*300 },
        { id: uid(), name:"입출금 통장",         category:"cash",       principal:2000000,  current:2000000,  memo:"비상금 및 생활비 계좌",                    createdAt: Date.now()-1000*60*60*24*10 }
      ]
    };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) { var seed = seedData(); saveState(seed); return seed; }
      var parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.assets)) throw new Error("bad shape");
      if(typeof parsed.goal !== "number") parsed.goal = 100000000;
      return parsed;
    }catch(e){
      var fallback = seedData();
      saveState(fallback);
      return fallback;
    }
  }
  function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  var state = loadState();
  var editingId = null;
  var deletingId = null;
  var selectedCat = "stock";

  // ---------- formatting ----------
  function won(n){
    n = Math.round(n || 0);
    return "₩" + n.toLocaleString("ko-KR");
  }
  function wonSigned(n){
    n = Math.round(n || 0);
    var sign = n > 0 ? "+" : (n < 0 ? "-" : "");
    return sign + "₩" + Math.abs(n).toLocaleString("ko-KR");
  }
  function pctSigned(p){
    if(!isFinite(p)) p = 0;
    var sign = p > 0 ? "+" : "";
    return sign + p.toFixed(1) + "%";
  }
  function trendClass(n){ return n > 0.001 ? "up" : (n < -0.001 ? "down" : "flat"); }

  // ---------- computation ----------
  function computeAsset(a){
    var profit = a.current - a.principal;
    var pct = a.principal > 0 ? (profit / a.principal) * 100 : 0;
    return { profit: profit, pct: pct };
  }
  function computeTotals(){
    var principal = 0, current = 0;
    state.assets.forEach(function(a){ principal += Number(a.principal)||0; current += Number(a.current)||0; });
    var profit = current - principal;
    var pct = principal > 0 ? (profit / principal) * 100 : 0;
    return { principal:principal, current:current, profit:profit, pct:pct };
  }

  // ---------- rendering ----------
  var chart = null;

  function render(){
    var t = computeTotals();

    document.getElementById("totalValue").textContent = won(t.current);
    var badge = document.getElementById("totalBadge");
    var tc = trendClass(t.pct);
    badge.className = "badge " + tc;
    badge.innerHTML = (tc==="up"?ICON_UP:tc==="down"?ICON_DOWN:"") + " " + pctSigned(t.pct);

    document.getElementById("totalPrincipal").textContent = won(t.principal);
    var profitEl = document.getElementById("totalProfit");
    profitEl.textContent = wonSigned(t.profit);
    profitEl.className = "v " + tc;

    // goal
    var goalPct = state.goal > 0 ? Math.min(999, (t.current / state.goal) * 100) : 0;
    document.getElementById("goalPct").textContent = goalPct.toFixed(1) + "%";
    document.getElementById("goalFill").style.width = Math.min(100, goalPct) + "%";
    document.getElementById("goalCurrent").textContent = won(t.current);
    document.getElementById("goalTarget").textContent = "목표 " + won(state.goal);

    renderAllocation(t);
    renderList();

    document.getElementById("assetCount").textContent = state.assets.length + "개";
  }

  function renderAllocation(totals){
    var sums = {};
    CAT_ORDER.forEach(function(k){ sums[k] = 0; });
    state.assets.forEach(function(a){
      sums[a.category] = (sums[a.category]||0) + (Number(a.current)||0);
    });
    var present = CAT_ORDER.filter(function(k){ return sums[k] > 0; });
    var total = totals.current;

    document.getElementById("donutCatCount").textContent = present.length;

    var legend = document.getElementById("legendList");
    legend.innerHTML = "";
    present
      .slice()
      .sort(function(a,b){ return sums[b]-sums[a]; })
      .forEach(function(k){
        var pct = total > 0 ? (sums[k]/total*100) : 0;
        var row = document.createElement("div");
        row.className = "legend-row";
        row.innerHTML =
          '<span class="legend-dot" style="background:'+CATS[k].color+'"></span>' +
          '<span class="legend-name">'+CATS[k].label+'</span>' +
          '<span class="legend-pct">'+pct.toFixed(0)+'%</span>';
        legend.appendChild(row);
      });

    var ctx = document.getElementById("allocChart").getContext("2d");
    var data = present.map(function(k){ return sums[k]; });
    var colors = present.map(function(k){ return CATS[k].color; });

    if(!window.Chart){ return; }

    if(chart){
      chart.data.labels = present.map(function(k){ return CATS[k].label; });
      chart.data.datasets[0].data = data;
      chart.data.datasets[0].backgroundColor = colors;
      chart.update();
    } else {
      chart = new Chart(ctx, {
        type: "doughnut",
        data: {
          labels: present.map(function(k){ return CATS[k].label; }),
          datasets: [{
            data: data,
            backgroundColor: colors,
            borderColor: "#12161E",
            borderWidth: 3,
            hoverOffset: 4
          }]
        },
        options: {
          cutout: "72%",
          plugins: {
            legend: { display:false },
            tooltip: {
              backgroundColor: "#1A2029",
              titleColor: "#F3F5F8",
              bodyColor: "#F3F5F8",
              titleFont: { family: "'IBM Plex Sans KR'", weight:"600" },
              bodyFont: { family: "'IBM Plex Mono'" },
              padding: 10,
              cornerRadius: 8,
              displayColors: true,
              callbacks: {
                label: function(ctx){
                  var v = ctx.parsed;
                  var pct = total>0 ? (v/total*100).toFixed(1) : "0.0";
                  return " " + won(v) + "  (" + pct + "%)";
                }
              }
            }
          },
          animation: { duration: 500 }
        }
      });
    }
  }

  function renderList(){
    var list = document.getElementById("assetList");
    list.innerHTML = "";

    if(state.assets.length === 0){
      list.innerHTML = '<div class="empty-state">아직 등록된 자산이 없어요.<br>오른쪽 아래 + 버튼으로 추가해보세요.</div>';
      return;
    }

    var sorted = state.assets.slice().sort(function(a,b){ return b.current - a.current; });

    sorted.forEach(function(a){
      var c = computeAsset(a);
      var tc = trendClass(c.pct);
      var cat = CATS[a.category] || CATS.other;

      var row = document.createElement("div");
      row.className = "asset-row";
      row.setAttribute("data-id", a.id);
      row.innerHTML =
        '<span class="asset-icon" style="background:'+cat.color+'22;color:'+cat.color+'">' +
          '<svg viewBox="0 0 24 24" fill="none">'+cat.icon+'</svg>' +
        '</span>' +
        '<span class="asset-main">' +
          '<p class="asset-name">'+escapeHtml(a.name)+'</p>' +
          '<p class="asset-cat">'+cat.label+'</p>' +
        '</span>' +
        '<span class="asset-figures">' +
          '<p class="asset-value">'+won(a.current)+'</p>' +
          '<p class="asset-change '+tc+'">'+(tc==="up"?ICON_UP:tc==="down"?ICON_DOWN:"")+' '+pctSigned(c.pct)+'</p>' +
        '</span>' +
        '<button class="asset-del" type="button" aria-label="삭제" data-id="'+a.id+'">'+ICON_TRASH+'</button>';

      row.addEventListener("click", function(ev){
        if(ev.target.closest(".asset-del")) return;
        openForm(a.id);
      });
      row.querySelector(".asset-del").addEventListener("click", function(ev){
        ev.stopPropagation();
        openDelete(a.id);
      });

      list.appendChild(row);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(m){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m];
    });
  }

  // ---------- form sheet ----------
  var formScrim = document.getElementById("formScrim");
  var formSheet = document.getElementById("formSheet");
  var assetForm = document.getElementById("assetForm");

  function buildCatChips(){
    var wrap = document.getElementById("catChips");
    wrap.innerHTML = "";
    CAT_ORDER.forEach(function(k){
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "cat-chip" + (k===selectedCat ? " active":"");
      chip.style.color = k===selectedCat ? CATS[k].color : "";
      chip.setAttribute("data-cat", k);
      chip.innerHTML = '<span class="dot" style="background:'+CATS[k].color+'"></span>' + CATS[k].label;
      chip.addEventListener("click", function(){
        selectedCat = k;
        buildCatChips();
      });
      wrap.appendChild(chip);
    });
  }

  function openForm(id){
    editingId = id || null;
    var titleEl = document.getElementById("formTitle");
    var submitBtn = document.getElementById("formSubmit");

    if(editingId){
      var a = state.assets.find(function(x){ return x.id === editingId; });
      titleEl.textContent = "자산 수정";
      submitBtn.textContent = "수정 완료";
      document.getElementById("f_name").value = a.name;
      document.getElementById("f_principal").value = a.principal;
      document.getElementById("f_current").value = a.current;
      document.getElementById("f_memo").value = a.memo || "";
      selectedCat = a.category;
    } else {
      titleEl.textContent = "자산 추가";
      submitBtn.textContent = "저장";
      assetForm.reset();
      selectedCat = "stock";
    }
    buildCatChips();
    updatePreview();
    openSheet(formScrim, formSheet);
    setTimeout(function(){ document.getElementById("f_name").focus({preventScroll:true}); }, 320);
  }
  function closeForm(){ closeSheet(formScrim, formSheet); editingId = null; }

  function updatePreview(){
    var p = parseFloat(document.getElementById("f_principal").value) || 0;
    var c = parseFloat(document.getElementById("f_current").value) || 0;
    var profit = c - p;
    var pct = p > 0 ? (profit/p*100) : 0;
    var tc = trendClass(pct);
    var profitEl = document.getElementById("prevProfit");
    var pctEl = document.getElementById("prevPct");
    profitEl.textContent = wonSigned(profit);
    profitEl.className = "pv " + tc;
    pctEl.textContent = pctSigned(pct);
    pctEl.className = "pv " + tc;
  }

  document.getElementById("f_principal").addEventListener("input", updatePreview);
  document.getElementById("f_current").addEventListener("input", updatePreview);

  assetForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    var name = document.getElementById("f_name").value.trim();
    var principal = parseFloat(document.getElementById("f_principal").value) || 0;
    var current = parseFloat(document.getElementById("f_current").value) || 0;
    var memo = document.getElementById("f_memo").value.trim();
    if(!name) return;

    if(editingId){
      var a = state.assets.find(function(x){ return x.id === editingId; });
      a.name = name; a.category = selectedCat; a.principal = principal; a.current = current; a.memo = memo;
      showToast("자산 정보를 수정했어요");
    } else {
      state.assets.push({ id: uid(), name:name, category:selectedCat, principal:principal, current:current, memo:memo, createdAt: Date.now() });
      showToast("자산을 추가했어요");
    }
    saveState();
    render();
    closeForm();
  });

  document.getElementById("formCancel").addEventListener("click", closeForm);
  formScrim.addEventListener("click", function(e){ if(e.target === formScrim) closeForm(); });
  document.getElementById("addFab").addEventListener("click", function(){ openForm(null); });

  // ---------- goal sheet ----------
  var goalScrim = document.getElementById("goalScrim");
  var goalSheet = document.getElementById("goalSheet");

  document.getElementById("editGoalBtn").addEventListener("click", function(){
    document.getElementById("f_goal").value = state.goal;
    openSheet(goalScrim, goalSheet);
    setTimeout(function(){ document.getElementById("f_goal").focus({preventScroll:true}); }, 320);
  });
  document.getElementById("goalCancel").addEventListener("click", function(){ closeSheet(goalScrim, goalSheet); });
  goalScrim.addEventListener("click", function(e){ if(e.target === goalScrim) closeSheet(goalScrim, goalSheet); });
  document.getElementById("goalSave").addEventListener("click", function(){
    var v = parseFloat(document.getElementById("f_goal").value) || 0;
    state.goal = v;
    saveState();
    render();
    closeSheet(goalScrim, goalSheet);
    showToast("목표 금액을 수정했어요");
  });

  // ---------- delete sheet ----------
  var delScrim = document.getElementById("delScrim");
  var delSheet = document.getElementById("delSheet");

  function openDelete(id){
    deletingId = id;
    var a = state.assets.find(function(x){ return x.id === id; });
    document.getElementById("delName").textContent = a ? a.name : "";
    openSheet(delScrim, delSheet);
  }
  document.getElementById("delCancel").addEventListener("click", function(){ closeSheet(delScrim, delSheet); deletingId = null; });
  delScrim.addEventListener("click", function(e){ if(e.target === delScrim){ closeSheet(delScrim, delSheet); deletingId = null; } });
  document.getElementById("delConfirm").addEventListener("click", function(){
    state.assets = state.assets.filter(function(x){ return x.id !== deletingId; });
    saveState();
    render();
    closeSheet(delScrim, delSheet);
    showToast("자산을 삭제했어요");
    deletingId = null;
  });

  // ---------- sheet helpers ----------
  function openSheet(scrim, sheet){
    scrim.classList.add("open");
    sheet.classList.add("open");
  }
  function closeSheet(scrim, sheet){
    scrim.classList.remove("open");
    sheet.classList.remove("open");
  }

  // ---------- toast ----------
  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  // ---------- date ----------
  function renderDate(){
    var d = new Date();
    var fmt = new Intl.DateTimeFormat("ko-KR", { month:"long", day:"numeric", weekday:"short" });
    document.getElementById("todayLabel").textContent = fmt.format(d);
  }

  renderDate();
  render();

})();

</script>
</body>
</html>
